<h1>health-panel-multi-account — 发布说明</h1>
<p class="updated"><span class="entry-case-id">CASE-2026-065</span> · 更新: 2026-08-21</p>
<p>health_panel v16.7.0 增加体检固定账户“我/老婆”：默认显示“我”，当前页面会话内可切换“老婆”。切换后体检摘要、趋势、历年报告和 PDF 导入目标按账户隔离；同一报告可分别导入两个账户，同一账户仍防重复。</p>
<p>旧体检报告迁移为 <code>self</code>。浏览器和服务端不保存/复制 PDF 原文或识别全文，确认后只保留结构化结果。其他健康模块保持单用户现状。</p>
