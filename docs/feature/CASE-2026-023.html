<h1>goal-activity-heatmap — 发布说明</h1>
<p class="updated">更新: 2026-08-11</p>
<p>Goal 详情页新增"活动"热力条：仿 GitHub 贡献图 / Claude 用量图，用色阶格子展示该 Goal 下持续跟进的密度。数据来自各 Case 已有的事件历史（<code>GET /api/cases/{id}/timeline</code>），不新增后端接口、不改 schema。活动跨度 ≤14 天按小时分桶，超过自动降级按天分桶；格子连续铺开、含 0 事件空档，能看出跟进节奏和中断。点击格子会滚动定位并高亮下方"时间线"列表里对应的 Case。</p>
