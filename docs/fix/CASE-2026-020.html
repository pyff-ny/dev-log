<h1>修复 Promote Inbox 未初始化生命周期签名链 — 发布说明</h1>
<p class="updated"><span class="entry-case-id">CASE-2026-020</span> · 更新: 2026-08-11</p>
<p>修复 Case Manager 的 Promote Inbox → Case 流程：通过 Promote 创建的 Case 现在会与直接创建的 Case 一样，自动获得签名的 <code>lifecycle.initialized</code> 创世事件和 macOS Keychain anchor，不再出现"生命周期权威未初始化"错误， 不再需要用户手动点击"确认并初始化生命周期"补救。</p>
